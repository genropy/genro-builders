[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genro-builders"
version = "0.18.0"
description = "Builder system for genro-bag - grammar, validation, compilation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Genropy Team"}
]
keywords = [
    "builder",
    "compiler",
    "grammar",
    "validation",
    "genro",
    "genropy"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "genro-bag>=0.18.5",
    "genro-toolbox>=0.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "sphinx-autodoc-typehints>=3.0.0",
    "myst-parser>=4.0.0",
    "sphinxcontrib-mermaid>=1.0.0",
]
xsd = [
    "xmlschema>=4.0,<5",
]
jupyter = [
    "ipython>=8.0",
    "jupyter>=1.0",
    "watchfiles>=0.21",
]
reverse = [
    "tree-sitter>=0.25",
    "tree-sitter-css>=0.25",
]
live = [
    "genro-asgi>=0.5.0",
]
all = [
    "genro-builders[dev,docs,xsd,jupyter,reverse,live]",
]

[project.scripts]
genro-live = "genro_builders.contrib.live.cli:main"

[project.urls]
Homepage = "https://github.com/genropy/genro-builders"
Repository = "https://github.com/genropy/genro-builders"

[tool.hatch.build.targets.wheel]
packages = ["src/genro_builders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=genro_builders --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
extend-exclude = ["archive"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long
    "B008",   # no function calls in arg defaults
]

[tool.ruff.lint.per-file-ignores]
# Example notebooks favour compact one-liners (e.g. ``p = Page(); p.create()``)
# for didactic density. Multi-statement-on-one-line is intentional there.
"**/examples/**/*.ipynb" = ["E702"]
# SIM118 ("key in dict" over "key in dict.keys()") is a false positive on
# genro_bag Bags: ``for key in bag`` iterates the *nodes*, while
# ``bag.keys()`` yields the *string keys* the loop needs. The two are NOT
# equivalent here, so the rewrite would break ``bag.get_item(key)``.
"**/contrib/live/app.py" = ["SIM118"]
"**/contrib/live/pages/*.py" = ["SIM118"]

[tool.ruff.lint.isort]
known-first-party = ["genro_builders"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src/genro_builders"]
# Tutorial examples are runnable scripts, not library code. Their files share
# module names across dialects (e.g. 01_introduction.py in css/html/svg), which
# collide under mypy's module resolution. They are excluded from type checking.
exclude = "/examples/"

# The grammar machine works with BuilderBag/BuilderBagNode but receives them
# typed as the genro_bag base Bag/BagNode (e.g. node.value, type(parent_bag)).
# BuilderBag adds builder=/handler= kwargs and the _builder/_handler slots that
# the base types don't declare. This is a known, accepted type boundary: the
# code is correct at runtime. We silence only the two error codes this boundary
# produces, scoped to this module, rather than littering the code with casts.
[[tool.mypy.overrides]]
module = "genro_builders.builder._grammar"
disable_error_code = ["call-arg", "union-attr"]

# Same BuilderBag/BagNode boundary: __getattr__ dispatches to builder methods
# resolved dynamically (getattr on the active builder), which mypy can't narrow.
[[tool.mypy.overrides]]
module = "genro_builders.builder_bag"
disable_error_code = ["misc"]

# HTML/SVG renderers override _render_node with dialect-specific walk params,
# incompatible with the base **walk_kwargs signature. These signatures will be
# reworked by the render_walk_generator subtask (Fase 2); silenced until then.
[[tool.mypy.overrides]]
module = [
    "genro_builders.contrib.html.html_renderer",
    "genro_builders.contrib.svg.svg_renderer",
]
disable_error_code = ["override"]

# Walk-based lookups on the handler (node_by_id, abs_datapath helpers,
# register_pointer) traverse the source tree via genro_bag's
# BagNode.parent_node / get_node_by_attr / Bag.node, which return BagNode.
# At runtime every node in a BuilderSource is a BuilderBagNode (invariant
# enforced at construction by the source), but mypy can't see this narrowing.
# We silence the resulting return-value/arg-type mismatches for this module
# rather than littering the code with casts.
[[tool.mypy.overrides]]
module = "genro_builders.builder_handler"
disable_error_code = ["return-value", "arg-type", "no-any-return"]

[tool.coverage.run]
source = ["src/genro_builders"]
branch = true
