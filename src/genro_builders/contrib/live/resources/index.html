<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Genro Builders Live Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
      font-size: 14px;
      display: flex;
      flex-direction: row;
      background: #1e1e1e;
      color: #d4d4d4;
    }

    /* Left pane: rendered HTML. */
    #render {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      min-width: 0;
      border-right: 2px solid #333;
    }
    #render-header {
      padding: 6px 12px;
      background: #252526;
      color: #999;
      font-size: 12px;
    }
    #render-iframe {
      flex: 1;
      border: none;
      background: #ffffff;
    }

    /* Right pane: trees, history, input — stacked, input pinned at the bottom. */
    #right {
      width: 42%;
      min-width: 360px;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
    }

    /* Top of right pane: two trees side by side. */
    #trees {
      display: flex;
      flex-direction: row;
      height: 40%;
      min-height: 140px;
      border-bottom: 1px solid #333;
    }
    .tree-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .tree-pane + .tree-pane { border-left: 1px solid #333; }
    .tree-header {
      padding: 4px 10px;
      background: #252526;
      color: #9cdcfe;
      font-size: 11px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      border-bottom: 1px solid #333;
    }
    .tree-body {
      flex: 1;
      overflow: auto;
      padding: 6px 8px;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
    }
    .tree ul { list-style: none; margin: 0; padding: 0 0 0 14px; }
    .tree > ul { padding-left: 0; }
    .tree li { white-space: nowrap; }
    .tree .caret {
      display: inline-block;
      width: 12px;
      cursor: pointer;
      user-select: none;
      color: #888;
    }
    .tree .caret.empty { cursor: default; color: #555; }
    .tree .tag      { color: #9cdcfe; }
    .tree .label    { color: #777; font-size: 11px; }
    .tree .attr-k   { color: #ce9178; }
    .tree .attr-v   { color: #c9c9c9; }
    .tree .pointer  { color: #4ec9b0; }
    .tree .literal  { color: #d4d4d4; }
    .tree .key      { color: #9cdcfe; }
    .tree .scalar   { color: #ce9178; }

    /* History: scrollable log, growing downward, just like a terminal. */
    #history {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      display: flex;
      flex-direction: column;
    }
    #history .entry { margin-bottom: 6px; }
    #history .entry-cmd { color: #4ec9b0; }
    #history .entry-ok  { color: #d4d4d4; }
    #history .entry-err { color: #f48771; }
    #history .entry-meta { color: #777; font-size: 11px; }

    /* Input row pinned at the very bottom. */
    #input-row {
      display: flex;
      padding: 6px 8px;
      background: #252526;
      border-top: 1px solid #333;
    }
    #prompt {
      color: #4ec9b0;
      padding: 6px 6px 6px 0;
      user-select: none;
    }
    #cmd {
      flex: 1;
      background: #1e1e1e;
      color: #d4d4d4;
      border: 1px solid #444;
      padding: 6px 8px;
      font-family: inherit;
      font-size: inherit;
      outline: none;
    }
    #cmd:focus { border-color: #007acc; }

    #status {
      padding: 3px 12px;
      background: #007acc;
      color: white;
      font-size: 11px;
      text-align: right;
    }
    #status.disconnected { background: #c14545; }
  </style>
</head>
<body>
  <div id="render">
    <div id="render-header">Rendered HTML</div>
    <iframe id="render-iframe" srcdoc=""></iframe>
  </div>
  <div id="right">
    <div id="trees">
      <div class="tree-pane">
        <div class="tree-header">Source bag</div>
        <div id="source-tree" class="tree tree-body"></div>
      </div>
      <div class="tree-pane">
        <div class="tree-header">Data bag</div>
        <div id="data-tree" class="tree tree-body"></div>
      </div>
    </div>
    <div id="history"><span class="entry-meta">Type a command and press Enter. Examples:
  render
  set_data page.title "Live!"
  set_attr h1 style "color:red"
  add_child body p text="aggiunto"
  remove_child body p_0</span></div>
    <div id="input-row">
      <span id="prompt">&gt;</span>
      <input id="cmd" type="text" autocomplete="off" spellcheck="false"
             placeholder="set_data page.title &quot;ciao&quot;">
    </div>
    <div id="status">connecting…</div>
  </div>
  <script src="app_js"></script>
</body>
</html>
