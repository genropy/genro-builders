<body>
  <h2>Profile</h2>
<div class="gnr-field" style="display: flex; gap: 4px; flex-direction: column; border: 1px solid #c8c8c8; padding: 6px 8px; border-radius: 6px">
  <label class="gnr-field-label">Name</label>
<input type="text" value="Mario Rossi"/>
</div>
<div class="gnr-field" style="display: flex; gap: 8px; flex-direction: row; align-items: center; border: 1px solid #c8c8c8; padding: 6px 8px">
  <label class="gnr-field-label">Born</label>
<input type="date" value="1980-05-12"/>
</div>
<div class="gnr-field" style="display: flex; gap: 4px; flex-direction: column">
  <label class="gnr-field-label">Favorite color</label>
<input type="color" value="#3498db"/>
</div>
<div class="gnr-field" style="display: flex; gap: 8px; flex-direction: row; align-items: center">
  <label class="gnr-field-label">Age</label>
<input type="number" value="45" min="0" max="120"/>
</div>
  <div style="display: flex; gap: 8px; align-items: center">
<input type="range" value="45" min="0" max="120"/>
<input type="checkbox" checked/>
  </div>
</body>
