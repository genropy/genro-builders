<body>
  <div class="gnr-border-container" style="display: grid; grid-template-areas: &quot;top top top&quot; &quot;left center right&quot; &quot;bottom bottom bottom&quot;; grid-template-rows: auto 1fr auto; grid-template-columns: auto 1fr auto; height: 360px; border: 1px solid #c8c8c8">
    <div class="gnr-zone" style="grid-area: top; min-width: 0; min-height: 0; height: 48px; padding: 8px; background: #f7f7f7">
      <h2>Containers demo</h2>
    </div>
    <div class="gnr-zone" style="grid-area: left; min-width: 0; min-height: 0; width: 160px; padding: 8px; background: #fafafa">
      <p>A sidebar zone</p>
    </div>
    <div class="gnr-zone" style="grid-area: center; min-width: 0; min-height: 0">
      <div class="gnr-tabs gnr-tabs-1" data-selected="people" style="display: flex; flex-direction: column">
        <style>.gnr-tabs-1 > .gnr-tab-panes > .gnr-tab-pane { display: none; }
.gnr-tabs-1[data-selected="people"] > .gnr-tab-panes > [data-key="people"] { display: block; }
.gnr-tabs-1[data-selected="people"] > .gnr-tab-bar > [data-set-value="people"] { background: #ffffff; border-color: #c8c8c8; font-weight: 600; }
.gnr-tabs-1[data-selected="places"] > .gnr-tab-panes > [data-key="places"] { display: block; }
.gnr-tabs-1[data-selected="places"] > .gnr-tab-bar > [data-set-value="places"] { background: #ffffff; border-color: #c8c8c8; font-weight: 600; }
</style>
        <div class="gnr-tab-bar" style="display: flex; flex-direction: row; gap: 2px">
          <div class="gnr-tab" data-set-pointer="html.ui.tab" data-set-value="people">People</div>
          <div class="gnr-tab" data-set-pointer="html.ui.tab" data-set-value="places">Places</div>
        </div>
        <div class="gnr-tab-panes" style="flex: 1">
          <div class="gnr-tab-pane" data-key="people">
            <p>Anna, Marco, Sara</p>
          </div>
          <div class="gnr-tab-pane" data-key="places">
            <p>Milano, Torino</p>
          </div>
        </div>
      </div>
    </div>
    <div class="gnr-zone" style="grid-area: bottom; min-width: 0; min-height: 0; height: 0"></div>
  </div>
</body>
