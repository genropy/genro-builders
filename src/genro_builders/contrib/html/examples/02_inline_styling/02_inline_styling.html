<body>
  <div style="color: white; background: #3498db; padding: 12px">CSS as kwargs</div>
  <div style="color: white; background: #2c3e50; padding-top: 12; padding-bottom: 12; padding-left: 24; font-size: 14px; text-align: center">Sub-property kwargs</div>
  <div style="color: white; padding: 6px; background: #e67e22">Explicit style + kwargs</div>
  <div style="background: #16a085; color: white; aspect-ratio: 3 / 1">style_ escape: aspect-ratio</div>
  <div style="background: #9b59b6; color: white; padding: 12px; border-top-left-radius: 12px; border-top-right-radius: 12px; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px">rounded macro (all corners)</div>
  <div style="background: #8e44ad; color: white; padding: 12px; border-top-left-radius: 20px; border-top-right-radius: 20px">rounded macro (top corners only)</div>
  <div style="background: #f1c40f; color: #2c3e50; padding: 12px; display: inline-block; transform: rotate(-3deg) scale(0.95)">transform macro: rotate + scale</div>
  <div style="background: #e74c3c; color: white; padding: 12px; filter: blur(2px) contrast(80)">filter macro: blur + contrast</div>
</body>
