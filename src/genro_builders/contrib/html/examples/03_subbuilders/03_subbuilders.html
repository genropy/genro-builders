<body>
  <h2>SVG primitives in one figure</h2>
<svg viewBox="0 0 360 160" style="width: 360; height: 160"><rect x="0" y="0" fill="#ecf0f1" style="width: 360; height: 160" /><circle cx="60" cy="40" r="24" fill="#1abc9c" /><circle cx="130" cy="40" r="24" fill="#3498db" /><circle cx="200" cy="40" r="24" fill="#9b59b6" /><ellipse cx="300" cy="40" rx="40" ry="20" fill="#e67e22" /><line x1="20" y1="90" x2="340" y2="90" stroke="#34495e" stroke-width="2" /><polygon points="60,150 100,110 140,150" fill="#e74c3c" /><text x="170" y="140" fill="#2c3e50" style="font-size: 14">inline SVG</text></svg></body>


<!-- Section 4 -->
<body>
  <h2>HTML overlay inside SVG</h2>
<svg viewBox="0 0 360 180" style="width: 360; height: 180"><rect x="0" y="0" rx="12" ry="12" fill="#2c3e50" style="width: 360; height: 180" /><circle cx="40" cy="40" r="20" fill="#f1c40f" />    <foreignObject x="80" y="20" xmlns="http://www.w3.org/1999/xhtml" style="width: 260; height: 140">
      <div style="color: white; font-family: sans-serif; padding: 8px">
        <div style="font-weight: 700; font-size: 16px">Mixed content</div>
        <p style="font-size: 13px; margin: 6px 0 0 0">This block is HTML rendered inside an SVG, ideal for long-form copy that SVG &lt;text&gt; cannot wrap natively.</p>
      </div>
    </foreignObject>
</svg></body>
